<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Premium Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Monogram 'IB' Reticle Brackets -->
  <path d="M 120,160 L 120,120 L 160,120" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 352,120 L 392,120 L 392,160" stroke="#818cf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 120,352 L 120,392 L 160,392" stroke="#818cf8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 392,352 L 392,392 L 352,392" stroke="#c084fc" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Academic Vault Emblem ('IB') -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="220" 
        font-weight="900" 
        letter-spacing="-6"
        fill="url(#accentGrad)" 
        text-anchor="middle"
        filter="url(#glow)">IB</text>
</svg>
